<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Find My Bus | Create Account</title><link rel="stylesheet" href="css/style.css"><style>.auth-wrap{min-height:calc(100vh - 76px);display:grid;place-items:center;padding:45px 6%}.auth-card{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:var(--shadow)}.auth-card h1{font-size:2.2rem;margin:10px 0}.auth-card p{color:var(--muted)}.auth-card label{display:block;font-weight:700;font-size:.85rem;margin:16px 0 7px}.auth-card input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px}.auth-submit{width:100%;margin-top:20px;border:0;border-radius:11px;padding:13px;background:var(--blue);color:#fff;font-weight:800}.auth-switch{text-align:center;margin-top:18px;font-size:.9rem}.auth-switch a{color:var(--blue);font-weight:700}.auth-message{min-height:24px;font-size:.88rem}</style></head><body><header class="navbar"><a class="brand" href="/"><span class="brand-mark">🚌</span><span>Find My Bus</span></a><a href="login.html" class="back">Sign in</a></header><main class="auth-wrap"><section class="auth-card"><span class="mini-label">GET STARTED</span><h1>Create account</h1><p>Save routes, favourites and travel preferences.</p><form id="signupForm"><label>Full name</label><input id="name" required placeholder="Your name"><label>Email</label><input id="email" type="email" required placeholder="you@example.com"><label>Password</label><input id="password" type="password" minlength="6" required placeholder="At least 6 characters"><button class="auth-submit">Create account</button></form><p id="message" class="auth-message"></p><div class="auth-switch">Already have an account? <a href="login.html">Sign in</a></div></section></main><script>document.getElementById('signupForm').onsubmit=async(e)=>{e.preventDefault();const message=document.getElementById('message');message.textContent='Creating account...';try{const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value.trim(),email:email.value.trim(),password:password.value})});const d=await r.json();if(!d.success)throw new Error(d.message);localStorage.setItem('fmb_token',d.token);localStorage.setItem('fmb_user',JSON.stringify(d.user));location.href='/';}catch(err){message.textContent=err.message;}}</script></body></html>
