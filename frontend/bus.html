<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find My Bus | Bus Details</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="css/style.css"><style>.page{padding:105px 6% 55px;max-width:1250px;margin:auto}.bus-head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:22px}.status{padding:7px 11px;border-radius:20px;background:#e9f8ef;color:#18794e;font-weight:800;font-size:.8rem}.layout{display:grid;grid-template-columns:1.5fr .8fr;gap:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}#busMap{height:480px;border-radius:15px;overflow:hidden}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.stat{background:#f7fafc;border-radius:12px;padding:14px}.stat small{display:block;color:var(--muted)}.stat strong{font-size:1.1rem}.stop-list{margin-top:15px}.stop-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.stop-dot{width:11px;height:11px;border:2px solid var(--blue);border-radius:50%}.muted{color:var(--muted)}.error{text-align:center;padding:40px}.backlink{display:inline-block;margin-bottom:16px;color:var(--blue);font-weight:700;text-decoration:none}@media(max-width:800px){.layout{grid-template-columns:1fr}.bus-head{align-items:flex-start;flex-direction:column}#busMap{height:350px}}</style></head><body><header class="navbar"><a class="brand" href="/"><span class="brand-mark">🚌</span><span>Find My Bus</span></a><nav class="nav-links"><a href="/">Home</a><a href="routes.html">Routes</a></nav><button class="login-btn" onclick="location.href='login.html'">Login</button></header><main class="page"><a class="backlink" href="routes.html">← Back to routes</a><div id="app"><div class="error">Loading bus details...</div></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><script>
const id=new URLSearchParams(location.search).get('id');
const app=document.getElementById('app');
let map,busMarker,routeLine,roadLine,socket,currentBus;
const stopMarkers=[];
const busEmojiIcon=L.divIcon({className:'bus-marker-emoji',html:'<div style="font-size:30px;filter:drop-shadow(0 2px 3px #0005)">🚌</div>',iconSize:[38,38],iconAnchor:[19,19]});
function stopIcon(kind,index){const styles={start:'background:#087a55;color:white;border:3px solid white',end:'background:#0d8fd8;color:white;border:3px solid white',middle:'background:#ffe08a;color:#3b321b;border:3px solid white'};return L.divIcon({className:'route-stop-marker',html:`<div style="width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;box-shadow:0 1px 6px #0005;${styles[kind]}">${index+1}</div>`,iconSize:[27,27],iconAnchor:[13,13]})}
function validPoint(s){const lat=Number(s.latitude),lng=Number(s.longitude);return Number.isFinite(lat)&&Number.isFinite(lng)&&Math.abs(lat)<=90&&Math.abs(lng)<=180&&(lat!==0||lng!==0)}
function routeStops(route){return (Array.isArray(route?.stops)?route.stops.slice().sort((a,b)=>(Number(a.sequence)||0)-(Number(b.sequence)||0)):[]).filter(validPoint)}
function setTrackingStatus(text){const el=document.getElementById('trackingStatus');if(el)el.textContent=text}
function drawRoute(route){
 const stops=routeStops(route),points=stops.map(s=>[Number(s.latitude),Number(s.longitude)]);
 stopMarkers.forEach(m=>map.removeLayer(m));stopMarkers.length=0;
 if(roadLine){map.removeLayer(roadLine);roadLine=null} if(routeLine){map.removeLayer(routeLine);routeLine=null}
 stops.forEach((s,i)=>{const kind=i===0?'start':i===stops.length-1?'end':'middle';const marker=L.marker(points[i],{icon:stopIcon(kind,i)}).addTo(map);marker.bindPopup('<b>'+String(s.name||('Stop '+(i+1))).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+'</b><br>'+(kind==='start'?'Route start':kind==='end'?'Route destination':'Intermediate stop'));stopMarkers.push(marker)});
 if(points.length>1){
   routeLine=L.polyline(points,{color:'#087a55',weight:5,opacity:.3,dashArray:'7 8'}).addTo(map);
   const coords=points.map(p=>p[1]+','+p[0]).join(';');
   fetch('https://router.project-osrm.org/route/v1/driving/'+coords+'?overview=full&geometries=geojson').then(r=>r.ok?r.json():null).then(data=>{if(!data?.routes?.[0]?.geometry?.coordinates)return;const road=data.routes[0].geometry.coordinates.map(p=>[p[1],p[0]]);if(roadLine)map.removeLayer(roadLine);roadLine=L.polyline(road,{color:'#087a55',weight:6,opacity:.88,lineJoin:'round'}).addTo(map);if(routeLine){map.removeLayer(routeLine);routeLine=null}if(!busMarker)map.fitBounds(roadLine.getBounds().pad(.12));}).catch(()=>{});
   map.fitBounds(L.latLngBounds(points).pad(.18));
 } else if(points.length===1)map.setView(points[0],14);
 return points;
}
function updateBusPosition(latitude,longitude,speed,timestamp){
 const pos=[Number(latitude),Number(longitude)];if(!Number.isFinite(pos[0])||!Number.isFinite(pos[1]))return;
 if(!busMarker)busMarker=L.marker(pos,{icon:busEmojiIcon,zIndexOffset:1000}).addTo(map);
 else busMarker.setLatLng(pos);
 busMarker.bindPopup('<b>🚌 '+String(currentBus?.busNumber||'Bus')+'</b><br>Live bus location<br>Speed: '+Number(speed||0).toFixed(1)+' km/h');
 if(!routeLine&&!roadLine)map.setView(pos,15);else map.panTo(pos,{animate:true,duration:.5});
 const speedEl=document.getElementById('speed');if(speedEl)speedEl.textContent=Number(speed||0).toFixed(1)+' km/h';
 const updatedEl=document.getElementById('updated');if(updatedEl)updatedEl.textContent='Last GPS update: '+(timestamp?new Date(timestamp).toLocaleString():'just now');
 setTrackingStatus('🟢 Live GPS tracking');
}
async function load(){
 if(!id){app.innerHTML='<div class="error">No bus selected.</div>';return}
 try{
  const response=await fetch('/api/buses/'+encodeURIComponent(id));const data=await response.json();if(!response.ok||!data.success)throw new Error(data.message||'Could not load bus details');
  currentBus=data.data;const route=currentBus.routeId||{};const stops=Array.isArray(route.stops)?route.stops.slice().sort((a,b)=>(Number(a.sequence)||0)-(Number(b.sequence)||0)):[];
  app.innerHTML='<div class="bus-head"><div><span class="mini-label">LIVE BUS TRACKING</span><h1>'+String(currentBus.busNumber||'Bus').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+'</h1><p class="muted">'+String(route.name||'Assigned public bus service')+'</p></div><span class="status">● '+String(currentBus.status||'inactive')+'</span></div><div class="layout"><section class="panel"><div id="busMap" role="application" aria-label="Live bus tracking map"></div><p id="trackingStatus" class="muted" style="margin:12px 2px;font-weight:800">Loading map and route…</p><div class="stats"><div class="stat"><small>Speed</small><strong id="speed">'+Number(currentBus.location?.speed||0)+' km/h</strong></div><div class="stat"><small>Route</small><strong>'+String(route.routeNumber||'—')+'</strong></div><div class="stat"><small>Fare</small><strong>₹'+Number(route.fare||0)+'</strong></div></div><p class="muted" id="updated">Last GPS update: '+(currentBus.location?.updatedAt?new Date(currentBus.location.updatedAt).toLocaleString():'Waiting for driver GPS')+'</p><p class="muted" style="font-size:.85rem">🟢 Green: route road · 🟡 Numbered circles: stops · 🚌 Bus emoji: live position</p></section><aside class="panel"><span class="mini-label">ROUTE STOPS</span><h2>'+String(route.source||stops[0]?.name||'Start')+' → '+String(route.destination||stops[stops.length-1]?.name||'Destination')+'</h2><p class="muted">'+Number(route.distanceKm||0)+' km · '+Number(route.estimatedDurationMinutes||0)+' min</p><div class="stop-list">'+(stops.map((s,i)=>'<div class="stop-row"><span style="width:25px;height:25px;flex:0 0 25px;display:grid;place-items:center;border-radius:50%;font-size:.75rem;font-weight:900;color:'+(i===0||i===stops.length-1?'white':'#45380b')+';background:'+(i===0?'#087a55':i===stops.length-1?'#0d8fd8':'#ffe08a')+'">'+(i+1)+'</span><span>'+String(s.name||'Stop').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+'</span>'+(i===0?'<small style="margin-left:auto;color:#087a55">START</small>':i===stops.length-1?'<small style="margin-left:auto;color:#0d8fd8">END</small>':'')+'</div>').join('')||'<p class="muted">Admin has not added GPS coordinates for route stops yet.</p>')+'</div></aside></div>';
  map=L.map('busMap',{zoomControl:true}).setView([12.65,75.45],11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19,tileError:()=>setTrackingStatus('Map tiles could not load. Check your internet connection.')}).addTo(map);
  const points=drawRoute(route);
  const loc=currentBus.location||{};
  if(validPoint(loc)){updateBusPosition(loc.latitude,loc.longitude,loc.speed,loc.updatedAt)}else if(points.length){setTrackingStatus('Route map ready · waiting for driver GPS to show the moving 🚌')}else{setTrackingStatus('Map ready · add GPS coordinates to route stops and enable driver GPS for live tracking')}
  setTimeout(()=>map.invalidateSize(true),250);setTimeout(()=>map.invalidateSize(true),1000);
  if(typeof io==='function'){socket=io({transports:['websocket','polling']});socket.on('bus:location',p=>{if(String(p.busId)!==String(currentBus._id))return;updateBusPosition(p.latitude,p.longitude,p.speed,p.timestamp)});socket.on('connect',()=>{if(!currentBus.location?.updatedAt)setTrackingStatus('Connected · waiting for driver GPS')});}
 }catch(error){app.innerHTML='<div class="error"><h2>Bus unavailable</h2><p class="muted">'+String(error.message||'Could not load bus details')+'</p></div>'}
}
load();
</script><nav class="mobile-bottom-nav" aria-label="Quick navigation"><a href="/"><span>⌂</span>Home</a><a href="routes.html"><span>⌁</span>Routes</a><a href="/#tracking"><span>◎</span>Live Map</a><a href="journey.html"><span>↗</span>Plan</a></nav>
</body></html>
