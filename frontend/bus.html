<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find My Bus | Bus Details</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="css/style.css"><style>.page{padding:105px 6% 55px;max-width:1250px;margin:auto}.bus-head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:22px}.status{padding:7px 11px;border-radius:20px;background:#e9f8ef;color:#18794e;font-weight:800;font-size:.8rem}.layout{display:grid;grid-template-columns:1.5fr .8fr;gap:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}#busMap{height:480px;border-radius:15px;overflow:hidden}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.stat{background:#f7fafc;border-radius:12px;padding:14px}.stat small{display:block;color:var(--muted)}.stat strong{font-size:1.1rem}.stop-list{margin-top:15px}.stop-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.stop-dot{width:11px;height:11px;border:2px solid var(--blue);border-radius:50%}.muted{color:var(--muted)}.error{text-align:center;padding:40px}.backlink{display:inline-block;margin-bottom:16px;color:var(--blue);font-weight:700;text-decoration:none}@media(max-width:800px){.layout{grid-template-columns:1fr}.bus-head{align-items:flex-start;flex-direction:column}#busMap{height:350px}}</style></head><body><header class="navbar"><a class="brand" href="/"><span class="brand-mark">🚌</span><span>Find My Bus</span></a><nav class="nav-links"><a href="/">Home</a><a href="routes.html">Routes</a></nav><button class="login-btn" onclick="location.href='login.html'">Login</button></header><main class="page"><a class="backlink" href="routes.html">← Back to routes</a><div id="app"><div class="error">Loading bus details...</div></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><script>const id=new URLSearchParams(location.search).get('id');const app=document.getElementById('app');let map,marker,bus;function icon(){return L.divIcon({className:'bus-marker',html:'🚌',iconSize:[34,34],iconAnchor:[17,17]})}async function load(){if(!id){app.innerHTML='<div class="error">No bus selected.</div>';return}try{const r=await fetch('/api/buses/'+encodeURIComponent(id));const d=await r.json();if(!d.success)throw new Error(d.message);bus=d.data;const route=bus.routeId||{};app.innerHTML=`<div class="bus-head"><div><span class="mini-label">BUS DETAILS</span><h1>${bus.busNumber}</h1><p class="muted">${route.name||'Assigned public bus service'}</p></div><span class="status">● ${bus.status||'inactive'}</span></div><div class="layout"><section class="panel"><div id="busMap"></div><div class="stats"><div class="stat"><small>Speed</small><strong id="speed">${bus.location?.speed||0} km/h</strong></div><div class="stat"><small>Route</small><strong>${route.routeNumber||'—'}</strong></div><div class="stat"><small>Fare</small><strong>₹${route.fare||0}</strong></div></div><p class="muted" id="updated">Last update: ${bus.location?.updatedAt?new Date(bus.location.updatedAt).toLocaleString():'No live update yet'}</p></section><aside class="panel"><span class="mini-label">ROUTE</span><h2>${route.source||'—'} → ${route.destination||'—'}</h2><p class="muted">${route.distanceKm||0} km · ${route.estimatedDurationMinutes||0} min</p><div class="stop-list">${(route.stops||[]).sort((a,b)=>a.sequence-b.sequence).map(s=>`<div class="stop-row"><span class="stop-dot"></span><span>${s.name}</span></div>`).join('')||'<p class="muted">No stop information available.</p>'}</div></aside></div>`;const loc=bus.location?.latitude&&bus.location?.longitude?[bus.location.latitude,bus.location.longitude]:[12.9716,77.5946];map=L.map('busMap').setView(loc,14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);if(bus.location?.latitude)marker=L.marker(loc,{icon:icon()}).addTo(map).bindPopup(`<b>${bus.busNumber}</b><br>Live location`).openPopup();const socket=io();socket.on('bus:location',p=>{if(String(p.busId)!==String(bus._id))return;const pos=[p.latitude,p.longitude];if(!marker)marker=L.marker(pos,{icon:icon()}).addTo(map);else marker.setLatLng(pos);map.panTo(pos);document.getElementById('speed').textContent=`${Number(p.speed||0).toFixed(1)} km/h`;document.getElementById('updated').textContent='Last update: '+new Date(p.timestamp).toLocaleString()})}catch(e){app.innerHTML=`<div class="error"><h2>Bus unavailable</h2><p class="muted">${e.message}</p></div>`}}load();</script></body></html>
