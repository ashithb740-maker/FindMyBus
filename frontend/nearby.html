<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find My Bus | Nearby</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="css/style.css"><style>.page{padding:105px 6% 55px;max-width:1250px;margin:auto}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.toolbar button{border:0;border-radius:12px;padding:13px 18px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.toolbar button.alt{background:#eef7ff;color:var(--blue)}.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}#nearMap{height:500px;border-radius:15px;overflow:hidden}.cards{display:grid;gap:12px;max-height:500px;overflow:auto}.card{border:1px solid var(--line);border-radius:15px;padding:16px}.card h3{margin:0 0 5px}.card p{margin:5px 0;color:var(--muted)}.pill{display:inline-block;background:#eaf8ef;color:#17774b;border-radius:20px;padding:5px 9px;font-size:.75rem;font-weight:800}.empty{text-align:center;color:var(--muted);padding:30px}.notice{padding:12px 15px;background:#fff8e7;border-radius:12px;color:#7a5b14;margin-bottom:15px}.distance{float:right;font-weight:800;color:var(--blue)}@media(max-width:850px){.layout{grid-template-columns:1fr}#nearMap{height:350px}.cards{max-height:none}}</style></head><body><header class="navbar"><a class="brand" href="/"><span class="brand-mark">🚌</span><span>Find My Bus</span></a><nav class="nav-links"><a href="/">Home</a><a href="routes.html">Routes</a><a class="active" href="nearby.html">Nearby</a><a href="journey.html">Plan Journey</a></nav><button class="login-btn" onclick="location.href='login.html'">Login</button></header><main class="page"><span class="mini-label">LOCATION SERVICES</span><h1>Find buses & stops near you</h1><p>Allow location access to discover nearby public buses and stops.</p><div class="toolbar"><button id="locate">📍 Use my location</button><button class="alt" id="refresh">↻ Refresh</button></div><div id="notice" class="notice">Location has not been detected yet.</div><div class="layout"><section class="panel"><h2>Nearby map</h2><div id="nearMap"></div></section><section class="panel"><h2>Nearby buses</h2><div id="buses" class="cards"><div class="empty">Waiting for your location...</div></div><h2 style="margin-top:25px">Nearby stops</h2><div id="stops" class="cards"><div class="empty">Waiting for your location...</div></div></section></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>let map,userMarker,userPos=null,allBuses=[],allRoutes=[];const $=id=>document.getElementById(id);function dist(a,b,c,d){const R=6371,rad=x=>x*Math.PI/180;const x=rad(c-a),y=rad(d-b);const z=Math.sin(x/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(z),Math.sqrt(1-z))}function marker(lat,lon,text,icon='🚌'){return L.marker([lat,lon],{icon:L.divIcon({className:'near-icon',html:`<span style="font-size:25px">${icon}</span>`,iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map).bindPopup(text)}async function data(){try{const [b,r]=await Promise.all([fetch('/api/buses'),fetch('/api/routes')]);const bd=await b.json(),rd=await r.json();allBuses=bd.data||[];allRoutes=rd.data||[];render()}catch(e){$('notice').textContent='Unable to load transport data. Start the backend and try again.'}}function render(){if(!userPos)return;map.eachLayer(l=>{if(l instanceof L.Marker&&l!==userMarker)map.removeLayer(l)});const buses=allBuses.filter(b=>b.location?.latitude&&b.location?.longitude).map(b=>({...b,d:dist(userPos.lat,userPos.lon,b.location.latitude,b.location.longitude)})).sort((a,b)=>a.d-b.d).slice(0,10);$('buses').innerHTML=buses.length?buses.map(b=>{const route=b.routeId||{};marker(b.location.latitude,b.location.longitude,`<b>${b.busNumber}</b><br>${route.name||'Bus service'}<br>${b.d.toFixed(2)} km away`);return `<article class="card"><span class="distance">${b.d.toFixed(2)} km</span><span class="pill">${b.status||'inactive'}</span><h3>🚌 ${b.busNumber}</h3><p>${route.source||'—'} → ${route.destination||'—'}</p><a href="bus.html?id=${b._id}" class="bus-link">View live bus →</a></article>`}).join(''):'<div class="empty">No buses with live GPS data found nearby.</div>';const stops=[];allRoutes.forEach(r=>(r.stops||[]).forEach(s=>{if(Number.isFinite(s.latitude)&&Number.isFinite(s.longitude))stops.push({...s,route:r,d:dist(userPos.lat,userPos.lon,s.latitude,s.longitude)})}));stops.sort((a,b)=>a.d-b.d);const near=stops.slice(0,10);$('stops').innerHTML=near.length?near.map(s=>{marker(s.latitude,s.longitude,`<b>${s.name}</b><br>Route ${s.route.routeNumber}`,'📍');return `<article class="card"><span class="distance">${s.d.toFixed(2)} km</span><h3>📍 ${s.name}</h3><p>Route ${s.route.routeNumber}: ${s.route.source} → ${s.route.destination}</p></article>`}).join(''):'<div class="empty">No stop data available.</div>'}function locate(){if(!navigator.geolocation){$('notice').textContent='Geolocation is not supported by this browser.';return}$('notice').textContent='Detecting your location…';navigator.geolocation.getCurrentPosition(p=>{userPos={lat:p.coords.latitude,lon:p.coords.longitude};if(!map){map=L.map('nearMap').setView([userPos.lat,userPos.lon],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map)}else map.setView([userPos.lat,userPos.lon],14);if(userMarker)map.removeLayer(userMarker);userMarker=L.marker([userPos.lat,userPos.lon]).addTo(map).bindPopup('<b>You are here</b>').openPopup();$('notice').textContent=`Location detected: ${userPos.lat.toFixed(5)}, ${userPos.lon.toFixed(5)}`;render()},e=>$('notice').textContent='Location permission was not granted. Please allow location access and try again.',{enableHighAccuracy:true,timeout:10000,maximumAge:30000})}$('locate').onclick=locate;$('refresh').onclick=()=>{data();if(userPos)locate()};data();locate();</script></body></html>
