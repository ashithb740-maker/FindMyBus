<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find My Bus | Journey Planner</title><link rel="stylesheet" href="css/style.css"><style>.page{padding:110px 6% 60px;max-width:1180px;margin:auto}.planner{background:linear-gradient(135deg,#f2f8ff,#f7fff9);border:1px solid var(--line);border-radius:24px;padding:28px;margin:24px 0 30px}.fields{display:grid;grid-template-columns:1fr 1fr auto;gap:12px}.field{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 15px}.field label{display:block;font-size:.75rem;color:var(--muted);font-weight:800;margin-bottom:5px}.field input{width:100%;border:0;outline:0;font-size:1rem}.find{border:0;border-radius:13px;padding:0 25px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.result-grid{display:grid;gap:16px}.journey{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.journey-top{display:flex;justify-content:space-between;gap:12px}.route-no{font-weight:900;color:var(--blue);font-size:1.15rem}.route-line{display:flex;align-items:center;gap:10px;margin:16px 0}.route-line .line{height:2px;flex:1;background:#d8e5ef}.meta{display:flex;gap:9px;flex-wrap:wrap}.tag{background:#eef7ff;padding:7px 10px;border-radius:9px;font-size:.8rem}.stops{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:.86rem}.action{display:inline-block;margin-top:15px;text-decoration:none;color:var(--blue);font-weight:800}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:760px){.fields{grid-template-columns:1fr}.find{height:48px}.journey-top{flex-direction:column}}</style></head><body><header class="navbar"><a class="brand" href="/"><span class="brand-mark">🚌</span><span>Find My Bus</span></a><nav class="nav-links"><a href="/">Home</a><a href="routes.html">Routes</a><a class="active" href="journey.html">Journey Planner</a></nav><button class="login-btn" onclick="location.href='login.html'">Login</button></header><main class="page"><span class="mini-label">JOURNEY PLANNER</span><h1>Plan your bus journey</h1><p>Enter your starting point and destination to find matching public bus routes.</p><section class="planner"><form id="planner"><div class="fields"><div class="field"><label>FROM</label><input id="from" required placeholder="e.g. Central Station"></div><div class="field"><label>TO</label><input id="to" required placeholder="e.g. Airport"></div><button class="find">Find Buses</button></div></form></section><div id="results" class="result-grid"></div></main><script>const results=document.getElementById('results');function score(r,a,b){const s=(r.source+' '+r.destination+' '+r.name+' '+r.routeNumber+' '+(r.stops||[]).map(x=>x.name).join(' ')).toLowerCase();let n=0;if(s.includes(a.toLowerCase()))n+=3;if(s.includes(b.toLowerCase()))n+=3;return n}async function plan(a,b){results.innerHTML='<div class="empty">Finding suitable routes...</div>';try{const res=await fetch('/api/routes');const json=await res.json();let routes=json.data||[];routes=routes.map(r=>({...r,_score:score(r,a,b)})).filter(r=>r._score>0).sort((x,y)=>y._score-x._score||x.estimatedDurationMinutes-y.estimatedDurationMinutes);if(!routes.length){results.innerHTML='<div class="empty">No direct matching route was found. Try a nearby stop or a different spelling.</div>';return}results.innerHTML=`<p class="muted">${routes.length} matching route${routes.length>1?'s':''} found</p>`+routes.map(r=>`<article class="journey"><div class="journey-top"><div><div class="route-no">🚌 ${r.routeNumber}</div><h2>${r.name}</h2></div><span class="tag">Direct match</span></div><div class="route-line"><strong>${r.source}</strong><span class="line"></span><strong>${r.destination}</strong></div><div class="meta"><span class="tag">⏱ ${r.estimatedDurationMinutes||0} min</span><span class="tag">📏 ${r.distanceKm||0} km</span><span class="tag">💰 ₹${r.fare||0}</span></div><div class="stops">${(r.stops||[]).sort((x,y)=>x.sequence-y.sequence).slice(0,8).map(s=>`<span>${s.name}</span>`).join(' · ')}</div><a class="action" href="routes.html">View route & buses →</a></article>`).join('')}catch(e){results.innerHTML='<div class="empty">Unable to plan the journey. Please start the backend and try again.</div>'}}document.getElementById('planner').onsubmit=e=>{e.preventDefault();plan(document.getElementById('from').value.trim(),document.getElementById('to').value.trim())};</script></body></html>
