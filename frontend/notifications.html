<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications | Find My Bus</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .page-shell{max-width:900px;margin:0 auto;padding:42px 20px}.topbar{max-width:900px;margin:0 auto;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;color:#1261a0;text-decoration:none;font-size:1.25rem}.back{color:#1261a0;text-decoration:none;font-weight:600}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.head h1{margin:0 0 8px}.head p{margin:0;color:#667085}.clear{border:0;background:#eef3f7;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}.notice{background:#fff;border:1px solid #e7edf3;border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:0 8px 22px rgba(20,45,70,.05);display:flex;gap:14px}.icon{font-size:1.5rem}.notice h3{margin:0 0 5px;font-size:1rem}.notice p{margin:0;color:#667085;line-height:1.5}.time{font-size:.8rem;color:#98a2b3;margin-top:8px}.empty{text-align:center;padding:45px;color:#667085;border:1px dashed #cbd5e1;border-radius:16px}
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="/">Find My Bus</a><a class="back" href="/">← Home</a></header>
  <main class="page-shell">
    <section class="head"><div><h1>🔔 Notifications</h1><p>Stay updated about your saved buses and routes.</p></div><button class="clear" onclick="clearNotifications()">Clear all</button></section>
    <div id="list"></div>
  </main>
  <script>
    const KEY='fmb_notifications';
    const defaults=[
      {icon:'🚌',title:'Live tracking is available',text:'Open Live Tracking to see currently active buses on the map.',time:'Find My Bus'},
      {icon:'📍',title:'Nearby buses',text:'Allow location access on the Nearby page to find buses and stops around you.',time:'Find My Bus'}
    ];
    function get(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');return Array.isArray(x)?x:defaults}catch{return defaults}}
    function render(){const items=get();document.getElementById('list').innerHTML=items.length?items.map(n=>`<article class="notice"><div class="icon">${escapeHtml(n.icon||'🔔')}</div><div><h3>${escapeHtml(n.title||'Notification')}</h3><p>${escapeHtml(n.text||'')}</p><div class="time">${escapeHtml(n.time||'')}</div></div></article>`).join(''):'<div class="empty">You are all caught up. 🎉</div>'}
    function clearNotifications(){localStorage.setItem(KEY,'[]');render()}
    function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    render();
  </script>
</body>
</html>
