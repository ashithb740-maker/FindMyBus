<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Favorites | Find My Bus</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .page-shell{max-width:1100px;margin:0 auto;padding:42px 20px}.page-head{margin-bottom:26px}.page-head h1{margin:0 0 8px}.page-head p{margin:0;color:#667085}.favorite-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.favorite-card{background:#fff;border:1px solid #e7edf3;border-radius:18px;padding:20px;box-shadow:0 10px 28px rgba(20,45,70,.07)}.favorite-card h3{margin:0 0 8px}.favorite-card p{color:#667085;margin:6px 0}.favorite-actions{display:flex;gap:10px;margin-top:16px}.favorite-actions a,.favorite-actions button{border:0;border-radius:10px;padding:10px 14px;text-decoration:none;cursor:pointer;font-weight:600}.open-btn{background:#1261a0;color:#fff}.remove-btn{background:#eef3f7;color:#344054}.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:40px;text-align:center;color:#667085}.topbar{max-width:1100px;margin:0 auto;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;color:#1261a0;text-decoration:none;font-size:1.25rem}.back{color:#1261a0;text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="/">Find My Bus</a><a class="back" href="/">← Home</a></header>
  <main class="page-shell">
    <section class="page-head"><h1>⭐ My Favorites</h1><p>Quick access to the buses and routes you save.</p></section>
    <div id="favorites" class="favorite-grid"></div>
  </main>
  <script>
    const KEY='fmb_favorites';
    const box=document.getElementById('favorites');
    function get(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}
    function save(items){localStorage.setItem(KEY,JSON.stringify(items));render()}
    function render(){const items=get(); if(!items.length){box.innerHTML='<div class="empty">No favorites yet.<br><br>Open a bus or route and use the favorite option when available.</div>';return;} box.innerHTML=items.map((x,i)=>`<article class="favorite-card"><h3>${escapeHtml(x.title||'Saved item')}</h3><p>${escapeHtml(x.subtitle||x.type||'Find My Bus')}</p><div class="favorite-actions">${x.url?`<a class="open-btn" href="${escapeAttr(x.url)}">Open</a>`:''}<button class="remove-btn" onclick="removeFavorite(${i})">Remove</button></div></article>`).join('')}
    function removeFavorite(i){const items=get();items.splice(i,1);save(items)}
    function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function escapeAttr(s){return escapeHtml(s).replace(/javascript:/gi,'')}
    render();
  </script>
</body>
</html>
