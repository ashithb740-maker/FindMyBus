<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find My Bus | Routes</title><link rel="stylesheet" href="css/style.css"><style>.page{padding:110px 6% 60px;max-width:1200px;margin:auto}.route-search{display:flex;gap:10px;margin:25px 0}.route-search input{flex:1;padding:14px;border:1px solid var(--line);border-radius:12px}.route-search button{border:0;border-radius:12px;padding:0 22px;background:var(--blue);color:white;font-weight:800}.route-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.route-card{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}.route-card h3{margin:8px 0}.route-card p{color:var(--muted)}.route-meta{display:flex;gap:8px;flex-wrap:wrap}.tag{background:#eef7ff;padding:6px 9px;border-radius:8px;font-size:.78rem}.stops{margin-top:16px;border-left:2px solid #dce8f2;padding-left:15px}.stop{padding:7px 0}.empty{text-align:center;padding:40px;color:var(--muted)}</style></head><body><header class="navbar"><a class="brand" href="/"><span class="brand-mark">🚌</span><span>Find My Bus</span></a><nav class="nav-links"><a href="/">Home</a><a class="active" href="routes.html">Routes</a><a href="/driver.html">Driver</a></nav><button class="login-btn" onclick="location.href='login.html'">Login</button></header><main class="page"><span class="mini-label">PUBLIC BUS ROUTES</span><h1>Explore routes & stops</h1><p>Search by route number, route name, source, destination or stop.</p><form class="route-search" id="routeForm"><input id="query" placeholder="e.g. 101, Central Station, Airport..."><button>Search</button></form><div id="results" class="route-grid"></div></main><script>const results=document.getElementById('results');async function load(q=''){results.innerHTML='<div class="empty">Loading routes...</div>';try{const r=await fetch('/api/routes?search='+encodeURIComponent(q));const d=await r.json();const routes=d.routes||[];if(!routes.length){results.innerHTML='<div class="empty">No matching routes found.</div>';return}results.innerHTML=routes.map(x=>`<article class="route-card"><span class="tag">Route ${x.routeNumber}</span><h3>${x.name}</h3><p>📍 ${x.source} → ${x.destination}</p><div class="route-meta"><span class="tag">${x.distanceKm||0} km</span><span class="tag">${x.estimatedDurationMinutes||0} min</span><span class="tag">₹${x.fare||0}</span></div><div class="stops"><strong>Stops</strong>${(x.stops||[]).sort((a,b)=>a.sequence-b.sequence).map(s=>`<div class="stop">${s.sequence}. ${s.name}</div>`).join('')||'<div class="stop">Stop data unavailable</div>'}</div></article>`).join('')}catch(e){results.innerHTML='<div class="empty">Unable to load route data. Start the backend and try again.</div>'}}document.getElementById('routeForm').onsubmit=e=>{e.preventDefault();load(query.value)};load();</script></body></html>
